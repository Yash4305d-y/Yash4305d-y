name: Generate Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Activity Graph
        uses: vn7n/activity-graph-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          CUSTOM_TITLE: "Activity Graph"
          BG_COLOR: "0D1117"
          TITLE_COLOR: "58A6FF"
          LINE: "58A6FF"
          POINT: "ffffff"
          AREA: "true"
          HIDE_BORDER: "true"
          OUTPUT: "output/activity-graph.svg"

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: output
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
